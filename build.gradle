plugins {
	id 'java-library'
	id 'eclipse'
	id 'idea'
	id 'maven-publish'
	id 'net.neoforged.gradle.userdev' version '7.0.163'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
	accessTransformers {
		file('src/main/resources/META-INF/accesstransformer.cfg')
	}
}

runs {
	configureEach {
		systemProperty 'forge.logging.markers', 'REGISTRIES'
		systemProperty 'forge.logging.console.level', 'debug'
		modSource project.sourceSets.main
	}

	client {
		systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
	}

	server {
		systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
		programArgument '--nogui'
	}

	gameTestServer {
		systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
	}

	data {
		programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
	}
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
	repositories {
		ivy {
			setName("ReplayMod")
			setUrl("https://minio.replaymod.com/replaymod/")
			patternLayout { artifact("[artifact]-[revision](-[classifier])(.[ext])") }
			metadataSources { artifact() }
			content { includeGroup("com.replaymod") }
		}
		maven {
			name = "Modrinth"
			url = "https://api.modrinth.com/maven"
		}
		maven { url 'https://jitpack.io' }
	}
}

dependencies {
	implementation "net.neoforged:neoforge:${neoforge_version}"

	// Replay Mod
	implementation "maven.modrinth:replaymod:${project.replaymod_version}"
	
	implementation("com.github.LlamaLad7:MixinExtras:0.4.1")
	annotationProcessor("com.github.LlamaLad7:MixinExtras:0.4.1")
	
	implementation(include('de.javagl:obj:0.3.0'))
	implementation('org.joml:joml:1.10.2')

	testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
}

tasks.withType(ProcessResources).configureEach {
	var replaceProperties = [
		minecraft_version: minecraft_version,
		minecraft_version_range: minecraft_version_range,
		neoforge_version: neoforge_version,
		neoforge_version_range: neoforge_version_range,
		loader_version_range: loader_version_range,
		mod_id: mod_id,
		mod_name: mod_name,
		mod_license: mod_license,
		mod_version: mod_version,
		mod_authors: mod_authors,
		mod_description: mod_description,
	]
	inputs.properties replaceProperties

	filesMatching(['META-INF/neoforge.mods.toml']) {
		expand replaceProperties + [project: project]
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}

test {
	useJUnitPlatform()
}

// Thanks to Modmuss for helping with this task!
tasks.register('addon', Zip) {
	from "addon"
	archiveBaseName = "import_vcap"
	destinationDirectory = project.layout.buildDirectory.dir("libs")
	
	filesMatching("**/__init__.py") {
		filter {
			it.replace("(0, 0, 0)", "(${version.replaceAll("[^\\d.]", "").split("\\.").join(", ")})")
			
		}
	}

	exclude "**/__pycache__*"
	exclude "*.py[cod]"
	exclude "*.py.class"
}